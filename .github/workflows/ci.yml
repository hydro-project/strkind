name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "22 04 * * *" # Daily at 9:22 PM PDT, 8:22 PM PST.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.base.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5.3.1

  check:
    name: Check
    if: ${{ needs.pre_job.outputs.should_skip != 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: pre_job

    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install nightly toolchain (minimal-versions check)
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-msrv
        uses: taiki-e/cache-cargo-install-action@f9eed3e4680f27610dc6d8c67be1b88593f7dade # v3.0.6
        with:
          tool: cargo-msrv

        - name: Run check.bash
          run: ./check.bash

  verus:
    name: Verus
    if: ${{ needs.pre_job.outputs.should_skip != 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: pre_job

    env:
      # Must match the `vstd` pin in verus-test/Cargo.toml (vstd is
      # Verus-version-coupled) and the Rust toolchain below. This Verus
      # release does not bundle z3; Z3_VERSION is from its tools/get-z3.sh.
      VERUS_VERSION: 0.2026.09.06.8dea4a2
      VERUS_TOOLCHAIN: 1.98.0
      Z3_VERSION: 4.16.0

    steps:
      - name: Checkout sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install the Verus-pinned Rust toolchain
        run: rustup toolchain install "$VERUS_TOOLCHAIN" --profile minimal --component clippy

      - name: Cache the Verus release
        id: cache-verus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/verus
          key: verus-${{ env.VERUS_VERSION }}-z3-${{ env.Z3_VERSION }}-x86-linux

      - name: Download the Verus release and z3
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/verus.zip "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q /tmp/verus.zip -d /tmp
          mv /tmp/verus-x86-linux ~/verus
          curl -sSfL -o /tmp/z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/z3-${Z3_VERSION}-x64-glibc-2.39.zip"
          unzip -q /tmp/z3.zip -d /tmp
          cp "/tmp/z3-${Z3_VERSION}-x64-glibc-2.39/bin/z3" ~/verus/z3
          chmod +x ~/verus/z3

      - name: Check verus-test under plain cargo
        run: cd verus-test && rustup run "$VERUS_TOOLCHAIN" cargo check --all-targets

      - name: Verify verus-test with the Verus driver
        run: |
          export PATH="$HOME/verus:$PATH"
          export RUSTUP_TOOLCHAIN="$VERUS_TOOLCHAIN"
          export VERUS_Z3_PATH="$HOME/verus/z3"
          cd verus-test && cargo verus verify
