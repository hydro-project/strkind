# Verification test for strkind's `verus` feature. Not published; excluded
# from the strkind package. Verified by `cargo verus verify` (run in Docker by
# ../scripts/verus-verify.sh, from ../check.bash and CI), and also built under
# plain cargo to prove a `verus`-feature-enabled consumer compiles
# warning-free without the Verus driver.
#
# The `vstd` version is pinned to the Verus release in
# ../scripts/verus-verify.sh; the two must match (vstd is Verus-version-coupled;
# ../check.bash checks this).

[package]
name = "strkind-verus-test"
publish = false
version = "0.0.0"
edition = "2024"

[workspace]
# Empty: standalone, not part of the strkind workspace.

[dependencies]
strkind = { path = "..", features = ["std", "serde", "verus"] }
# Pinned to the Verus release in ../scripts/verus-verify.sh;
# vstd is Verus-version-coupled and the two must match. This direct dependency
# is for this crate's own `verus! { ... }` code; the `strkind!` expansion uses
# strkind's vstd.
vstd = "=0.0.0-2026-09-06-0133"

[package.metadata.verus]
verify = true

[lints.rust]
# A consumer denying `unsafe_code` must still compile: the emitted
# `assume_specification` axioms expand to unsafe-marked items, and the
# expansion carries its own scoped `allow` (regression test for that).
unsafe_code = "deny"
# For warning-free plain-cargo builds of a `verus`-feature consumer: the
# emitted ghost blocks are gated on `cfg(verus_keep_ghost)`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)"] }
