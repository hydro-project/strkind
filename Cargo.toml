[package]
name = "strkind"
publish = true
version = "0.1.0"
documentation = "https://docs.rs/strkind/"
repository = "https://github.com/hydro-project/strkind"
readme = "README.md"
description = "Semantic string newtypes, generic over their storage: one type per kind of string, any string-like backing (String, str, Arc<str>, SmolStr, ...)."
edition = "2024"
license = "Apache-2.0"
keywords = ["newtype", "string", "id", "typed", "storage"]
categories = ["data-structures", "rust-patterns"]

[workspace]
# Empty: this crate is its own workspace.

[features]
default = ["serde"]
## Implements `Serialize`/`Deserialize` for generated kinds.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
smol_str = { version = "0.3", features = ["serde"] }

[lints.rust]
elided_lifetimes_in_paths = "warn"
impl_trait_overcaptures = "warn"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
unused_qualifications = "warn"

[lints.clippy]
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
let_and_return = "allow"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
# needless_pass_by_value = "warn" # TODO(mingwei): causes many breaking changes
or_fun_call = "warn"
ptr_as_ptr = "warn"
redundant_clone = "warn"
ref_as_ptr = "warn"
self_named_module_files = "warn"
single_match_else = "warn"
str_to_string = "warn"
try_err = "warn"
unused_async = "warn"
