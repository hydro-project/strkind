[package]
name = "strkind"
publish = true
version = "0.0.2"
documentation = "https://docs.rs/strkind/"
repository = "https://github.com/hydro-project/strkind"
readme = "README.md"
description = "Semantic string newtypes, generic over their storage: one type per kind of string, any string-like backing (String, str, Arc<str>, SmolStr, ...)."
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
keywords = ["newtype", "string", "id", "typed", "storage"]
categories = ["data-structures", "rust-patterns", "no-std"]
# The Verus verification test crate is its own workspace, not part of the
# published package (see `verus-test/Cargo.toml`).
exclude = ["/verus-test"]

[workspace]
# Empty: this crate is its own workspace.

[features]
default = ["std", "serde"]
# Enables `alloc`, and `std` support in optional dependencies.
std = ["alloc", "serde?/std", "vstd?/std"]
# Internal: an `example` module showing what `strkind!` generates, as rendered
# documentation (enabled on docs.rs). Not part of the crate's API; do not use.
_example = []
# `alloc`-backed API: the `String` default storage parameter, `From<&str>`,
# and `ToOwned` for the borrowed form. Without it, kinds are core-only:
# explicit storages (`Name<&str>`, `Name<heapless::String<N>>`, ...) and the
# borrowed `&Name<str>` form still work.
alloc = ["serde?/alloc", "vstd?/alloc"]
# Implement `Serialize`/`Deserialize` for generated kinds.
serde = ["dep:serde"]
# Emit a Verus (https://github.com/verus-lang/verus) verification boundary for
# each kind: an uninterpreted `View` (`Seq<char>`) plus a spec for `as_str`,
# inside `#[cfg(verus_keep_ghost)]` blocks (set only by the Verus driver, so
# under plain cargo they compile to nothing, and vstd is built only as an
# ordinary - ghost-erased - dependency).
verus = ["dep:vstd"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
# `1.0.95` is the minimal version that compiles on modern rustc (verified by
# the minimal-versions check in `check.bash`).
serde = { version = "1.0.95", default-features = false, optional = true }
# vstd is Verus-version-coupled: the requirement below is the minimum
# (`0.0.0-2026-09-06-0133` is the first release that specifies `&str`
# equality, which content comparisons through `as_str` rely on), and
# consumers should pin (via their lockfile) the vstd release matching their
# Verus toolchain. CI verifies against the matching Verus release (see
# `verus-test/` and `scripts/verus-verify.sh`).
#
# Forward-compat caveat of the open-ended range: strkind declares the
# `external_trait_specification` for `AsRef` (src/lib.rs), and Verus allows
# only one per trait per crate graph. If a future vstd ships its own, this
# declaration must be removed (and the floor raised to that vstd); until then
# such a vstd fails under the Verus driver. Likewise, two semver-incompatible
# strkind versions with `verus` enabled cannot coexist in one verified graph.
vstd = { version = ">=0.0.0-2026-09-06-0133", default-features = false, optional = true }

# Lets `cargo verus` (the Verus driver) verify this crate as a dependency of
# verified consumer crates, keeping the `#[cfg(verus_keep_ghost)]` ghost
# declarations below (the same mechanism vstd itself uses).
[package.metadata.verus]
verify = true

[dev-dependencies]
serde_json = "1"
smol_str = { version = "0.3", features = ["serde"] }
strkind = { path = ".", features = ["std"] }

[lints.rust]
elided_lifetimes_in_paths = "warn"
impl_trait_overcaptures = "warn"
missing_docs = "warn"
missing_unsafe_on_extern = "deny"
unsafe_attr_outside_unsafe = "deny"
# `verus_keep_ghost` is set by the Verus driver; the `verus` feature emits
# `#[cfg(verus_keep_ghost)]` blocks (compiled away under plain cargo).
# Consumers using the `verus` feature declare the same check-cfg.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)"] }
unused_qualifications = "warn"

[lints.clippy]
alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
let_and_return = "allow"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
# NOTE: does not fire inside macro expansions, so it cannot check the methods
# generated by `strkind!`; the `_CONST_METHODS` block in `core_tests` guards
# their const-ness instead.
missing_const_for_fn = "warn"
# needless_pass_by_value = "warn" # TODO(mingwei): causes many breaking changes
or_fun_call = "warn"
ptr_as_ptr = "warn"
redundant_clone = "warn"
ref_as_ptr = "warn"
self_named_module_files = "warn"
single_match_else = "warn"
str_to_string = "warn"
try_err = "warn"
unused_async = "warn"
